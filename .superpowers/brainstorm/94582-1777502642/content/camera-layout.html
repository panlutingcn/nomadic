<h2>拍照页布局</h2>
<p class="subtitle">全屏拍照页的具体设计，选择你偏好的版本</p>

<div class="split">

  <div class="mockup">
    <div class="mockup-header">A — 取景框全屏，底部操作栏</div>
    <div class="mockup-body" style="background:#1a1a1a;border-radius:10px;overflow:hidden;font-family:sans-serif;position:relative;min-height:320px">
      <!-- 顶部关闭 -->
      <div style="position:absolute;top:0;left:0;right:0;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;z-index:2">
        <span style="color:#fff;font-size:20px;opacity:0.9">✕</span>
        <span style="color:#fff;font-size:11px;opacity:0.7">印迹</span>
        <span style="width:20px"></span>
      </div>
      <!-- 取景框 -->
      <div style="background:#2a2a2a;height:220px;display:flex;align-items:center;justify-content:center">
        <span style="color:#555;font-size:11px">[ 相机取景框 ]</span>
      </div>
      <!-- 底部操作栏 -->
      <div style="background:#111;padding:16px;display:flex;align-items:center;justify-content:space-between">
        <div style="text-align:center">
          <div style="width:44px;height:44px;border-radius:8px;background:#333;display:flex;align-items:center;justify-content:center;margin:0 auto 4px">
            <span style="font-size:18px">🖼️</span>
          </div>
          <span style="color:#aaa;font-size:9px">相册</span>
        </div>
        <div style="width:60px;height:60px;border-radius:50%;border:3px solid #fff;display:flex;align-items:center;justify-content:center">
          <div style="width:48px;height:48px;border-radius:50%;background:#fff"></div>
        </div>
        <div style="width:44px"></div>
      </div>
    </div>
  </div>

  <div class="mockup">
    <div class="mockup-header">B — 取景框全屏，预览确认叠层</div>
    <div class="mockup-body" style="background:#1a1a1a;border-radius:10px;overflow:hidden;font-family:sans-serif;position:relative;min-height:320px">
      <!-- 顶部关闭 -->
      <div style="position:absolute;top:0;left:0;right:0;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;z-index:2">
        <span style="color:#fff;font-size:20px;opacity:0.9">✕</span>
        <span style="color:#fff;font-size:11px;opacity:0.7">印迹</span>
        <span style="width:20px"></span>
      </div>
      <!-- 取景框（拍完后变成预览图） -->
      <div style="background:#3a3028;height:220px;display:flex;align-items:center;justify-content:center;position:relative">
        <span style="color:#888;font-size:11px">[ 已拍摄的照片预览 ]</span>
      </div>
      <!-- 底部确认栏 -->
      <div style="background:#111;padding:16px;display:flex;align-items:center;justify-content:space-around">
        <div style="text-align:center">
          <div style="width:48px;height:48px;border-radius:50%;border:2px solid #666;display:flex;align-items:center;justify-content:center;margin:0 auto 4px">
            <span style="color:#fff;font-size:20px">✕</span>
          </div>
          <span style="color:#aaa;font-size:9px">重拍</span>
        </div>
        <div style="text-align:center">
          <div style="width:48px;height:48px;border-radius:50%;border:2px solid #1d9e75;background:rgba(29,158,117,0.15);display:flex;align-items:center;justify-content:center;margin:0 auto 4px">
            <span style="color:#1d9e75;font-size:20px">✓</span>
          </div>
          <span style="color:#1d9e75;font-size:9px">使用</span>
        </div>
      </div>
    </div>
  </div>

</div>

<div class="section" style="margin-top:16px">
  <p class="subtitle">两个版本的区别：A 是拍照和相册在同一个底部栏；B 是拍完后底部切换为 ✕/✓ 确认栏（相册入口在拍照前的底部栏左侧）。两者都支持相册上传。</p>
</div>
