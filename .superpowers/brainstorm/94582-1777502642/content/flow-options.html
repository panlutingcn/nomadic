<h2>印迹入口流程方案</h2>
<p class="subtitle">点击"印迹"按钮后的用户流程，选择你偏好的方案</p>

<div class="cards">

  <div class="card" data-choice="a" onclick="toggleSelect(this)">
    <div class="card-image" style="background:#f5f0e8;padding:16px;font-family:sans-serif">
      <div style="background:#fff;border-radius:12px;padding:12px;margin-bottom:8px;border:1px solid #e8dfd0">
        <div style="font-size:11px;color:#888;margin-bottom:6px">📷 拍照页</div>
        <div style="background:#ede8df;border-radius:8px;height:80px;display:flex;align-items:center;justify-content:center;margin-bottom:8px">
          <span style="font-size:22px">📷</span>
        </div>
        <div style="display:flex;gap:6px">
          <div style="flex:1;background:#f0ebe2;border-radius:6px;padding:6px;text-align:center;font-size:10px;color:#888">相册</div>
          <div style="flex:1;background:#1d9e75;border-radius:6px;padding:6px;text-align:center;font-size:10px;color:#fff">拍照</div>
        </div>
      </div>
      <div style="text-align:center;font-size:10px;color:#aaa;margin:4px 0">↓ 选图后显示预览</div>
      <div style="background:#fff;border-radius:12px;padding:10px;border:1px solid #e8dfd0">
        <div style="background:#ede8df;border-radius:8px;height:60px;display:flex;align-items:center;justify-content:center;margin-bottom:8px;position:relative">
          <span style="font-size:14px;color:#888">预览图</span>
          <div style="position:absolute;bottom:6px;right:6px;display:flex;gap:6px">
            <span style="background:rgba(0,0,0,0.5);color:#fff;border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:12px">✕</span>
            <span style="background:#1d9e75;color:#fff;border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:12px">✓</span>
          </div>
        </div>
        <div style="font-size:9px;color:#aaa;text-align:center">✓ 确认 → 跳转编辑页</div>
      </div>
    </div>
    <div class="card-body">
      <h3>A — 全屏拍照页</h3>
      <p>点击印迹直接进入全屏拍照界面，取景框占满屏幕。底部有"相册"和"拍照"两个按钮。选图/拍照后显示预览，用户点 ✓ 确认才跳转编辑页。</p>
    </div>
  </div>

  <div class="card" data-choice="b" onclick="toggleSelect(this)">
    <div class="card-image" style="background:#f5f0e8;padding:16px;font-family:sans-serif">
      <div style="background:#fff;border-radius:12px;padding:12px;border:1px solid #e8dfd0">
        <div style="font-size:11px;color:#888;margin-bottom:8px">📷 选择方式</div>
        <div style="display:flex;flex-direction:column;gap:8px">
          <div style="background:#ede8df;border-radius:10px;padding:14px;display:flex;align-items:center;gap:10px">
            <span style="font-size:20px">📷</span>
            <div>
              <div style="font-size:11px;font-weight:500;color:#3d3020">拍摄照片</div>
              <div style="font-size:9px;color:#888">打开相机拍摄</div>
            </div>
          </div>
          <div style="background:#ede8df;border-radius:10px;padding:14px;display:flex;align-items:center;gap:10px">
            <span style="font-size:20px">🖼️</span>
            <div>
              <div style="font-size:11px;font-weight:500;color:#3d3020">从相册选择</div>
              <div style="font-size:9px;color:#888">选择已有照片</div>
            </div>
          </div>
        </div>
        <div style="margin-top:10px;text-align:center;font-size:9px;color:#aaa">↓ 选图后显示预览 + ✕ / ✓</div>
      </div>
    </div>
    <div class="card-body">
      <h3>B — 选择方式页</h3>
      <p>点击印迹先进入一个简洁的选择页，显示"拍摄照片"和"从相册选择"两个选项。用户选择后进入对应流程，确认图片后跳转编辑页。</p>
    </div>
  </div>

</div>
